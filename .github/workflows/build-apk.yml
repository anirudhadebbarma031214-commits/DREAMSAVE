name: Build DreamSave APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DreamSave-v2.0-project/DreamSave/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runner image already includes Android SDK.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        working-directory: DreamSave-v2.0-project/DreamSave
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: DreamSave-v2.0-project/DreamSave
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s DreamSave-v2.0-project/DreamSave/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamSave-v2.0-apk
          path: DreamSave-v2.0-project/DreamSave/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
